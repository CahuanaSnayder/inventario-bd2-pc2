<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Sistema de Inventario</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand">
      <div class="brand-logo">INV</div>
      <div>
        <h1>Sistema de Inventario</h1>
        <p class="muted">Base de Datos II · UTP</p>
      </div>
    </div>

    <form id="login-form" autocomplete="on">
      <label>Usuario
        <input id="username" name="username" required autocomplete="username" placeholder="admin">
      </label>
      <label>Contraseña
        <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="••••••••">
      </label>
      <p id="login-error" class="alert error" hidden></p>
      <button type="submit" class="btn primary block">Ingresar</button>
    </form>

    <p class="muted small center" id="estado-bd">Verificando conexión con la base de datos…</p>
  </main>
  <script src="js/login.js"></script>
</body>
</html>
